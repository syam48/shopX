<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopX - E-Commerce</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f5f5f5;
}

/* Header */
header {
    background: #333;
    color: white;
    padding: 15px;
    text-align: center;
}

/* Controls */
.controls {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    flex-wrap: wrap;
}

input, select {
    padding: 8px;
    margin: 5px;
}

/* Products */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    padding: 20px;
    gap: 15px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

button {
    padding: 8px;
    margin-top: 5px;
    cursor: pointer;
}

/* Cart */
.cart {
    position: fixed;
    right: 0;
    top: 0;
    width: 250px;
    height: 100%;
    background: #222;
    color: white;
    padding: 10px;
    overflow-y: auto;
}

.dark {
    background: #111;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>ShopX 🛒</h1>
    <button onclick="toggleMode()">🌙</button>
</header>

<div class="controls">
    <input type="text" id="search" placeholder="Search...">
    
    <select id="category">
        <option value="all">All</option>
        <option value="electronics">Electronics</option>
        <option value="clothing">Clothing</option>
    </select>

    <select id="sort">
        <option value="default">Sort</option>
        <option value="low">Price Low-High</option>
        <option value="high">Price High-Low</option>
    </select>
</div>

<div class="products" id="products"></div>

<div class="cart" id="cart">
    <h2>Cart</h2>
    <div id="cartItems"></div>
    <h3 id="total"></h3>
</div>

<script>
const products = [
    {name:"Phone", price:20000, category:"electronics", img:"https://via.placeholder.com/150"},
    {name:"Laptop", price:50000, category:"electronics", img:"https://via.placeholder.com/150"},
    {name:"Shirt", price:1000, category:"clothing", img:"https://via.placeholder.com/150"},
    {name:"Jeans", price:2000, category:"clothing", img:"https://via.placeholder.com/150"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderProducts() {
    let list = document.getElementById("products");
    list.innerHTML = "";

    let search = document.getElementById("search").value.toLowerCase();
    let category = document.getElementById("category").value;
    let sort = document.getElementById("sort").value;

    let filtered = products
        .filter(p => p.name.toLowerCase().includes(search))
        .filter(p => category === "all" || p.category === category);

    if (sort === "low") filtered.sort((a,b)=>a.price-b.price);
    if (sort === "high") filtered.sort((a,b)=>b.price-a.price);

    filtered.forEach((p, i) => {
        let div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <img src="${p.img}">
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <button onclick="addToCart(${i})">Add to Cart</button>
        `;
        list.appendChild(div);
    });
}

function addToCart(i) {
    cart.push(products[i]);
    saveCart();
    renderCart();
}

function renderCart() {
    let items = document.getElementById("cartItems");
    let total = 0;
    items.innerHTML = "";

    cart.forEach((item, i) => {
        total += item.price;
        items.innerHTML += `
            <p>${item.name} - ₹${item.price}
            <button onclick="remove(${i})">❌</button></p>
        `;
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}

function remove(i) {
    cart.splice(i,1);
    saveCart();
    renderCart();
}

function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

function toggleMode() {
    document.body.classList.toggle("dark");
}

document.getElementById("search").oninput = renderProducts;
document.getElementById("category").onchange = renderProducts;
document.getElementById("sort").onchange = renderProducts;

renderProducts();
renderCart();
</script>

</body>
</html>
